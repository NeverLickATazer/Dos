<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmo's Cosmic Adventure</title>
<script src="coi-serviceworker.js"></script>
<style>
html,body{margin:0;background:#111;color:#eee;font-family:Arial,sans-serif;text-align:center;overflow:hidden}
.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;box-sizing:border-box}
canvas{width:min(720px,92vw);height:auto;image-rendering:pixelated;background:#000;border:2px solid #444}
.button{display:inline-block;margin-top:10px;padding:9px 14px;background:#1677b8;color:#fff;text-decoration:none;border-radius:7px;font-weight:bold}
</style>
<script>
document.addEventListener('keydown', function(e) {
  const keys = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter','AltLeft','AltRight'];
  if (keys.includes(e.code)) e.preventDefault();
}, { passive: false });

document.addEventListener('keyup', function(e) {
  const keys = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter','AltLeft','AltRight'];
  if (keys.includes(e.code)) e.preventDefault();
}, { passive: false });
</script>
</head>
<body>
<div class="wrap">
<canvas id="canvas" width="960" height="600"></canvas>
<a class="button" href="../index.html">← Back to DOS Arcade</a>
</div>
<script>
var statusEl=document.createElement('div');
var Module={
  canvas:document.getElementById('canvas'),
  print:function(t){},
  printErr:function(t){console.error(t);}
};
</script>
<script src="cosmo1.js"></script>
</body>
</html>
