name: Inspect Noah Bundle

on:
  push:
    paths:
      - ".github/workflows/inspect-noah.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Noah bundle
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/noah
          unzip -o games/noahs-ark.jsdos -d /tmp/noah >/dev/null
          {
            echo "=== ZIP FILES ==="
            unzip -l games/noahs-ark.jsdos
            echo
            echo "=== DOSBOX CONFIG ==="
            cat /tmp/noah/.jsdos/dosbox.conf || true
            echo
            echo "=== JSDOS JSON ==="
            cat /tmp/noah/.jsdos/jsdos.json || true
            echo
            echo "=== EXE STRINGS ==="
            strings /tmp/noah/noah3dos.exe | grep -Ei 'noah|3d|version|memory|error|sound|vga|wolf' | head -100 || true
          } > noah-inspection.txt
      - name: Save inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noah-inspection.txt
          git commit -m "Add Noah bundle inspection"
          git push
