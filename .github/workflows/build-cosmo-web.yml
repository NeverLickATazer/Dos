name: Build Cosmo Web

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-cosmo-web.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out arcade
        uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Clone native Cosmo source
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/digows/cosmo.git cosmo-src

      - name: Configure Emscripten build
        shell: bash
        run: |
          source "$EMSDK/emsdk_env.sh"
          emcmake cmake -S cosmo-src -B cosmo-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCOSMO_BUILD_TESTS=OFF \
            -DCOSMO_BUILD_GAME=ON \
            -DCOSMO_BUNDLE=OFF \
            -DCOSMO_FETCH_SDL=ON \
            -DCMAKE_C_EXTENSIONS=ON \
            -DCMAKE_CXX_EXTENSIONS=ON \
            -DCMAKE_EXE_LINKER_FLAGS='-sALLOW_MEMORY_GROWTH=1' \
            -DCMAKE_SHARED_LINKER_FLAGS='-sALLOW_MEMORY_GROWTH=1'

      - name: Fix Emscripten C extension mode for SDL3
        shell: bash
        run: |
          find cosmo-build -type f \( -name 'build.make' -o -name 'flags.make' -o -name 'link.txt' \) -print0 | \
            xargs -0 -r sed -i -E 's/-std=c([0-9]+)/-std=gnu\1/g'

      - name: Build
        shell: bash
        run: |
          source "$EMSDK/emsdk_env.sh"
          cmake --build cosmo-build --config Release -j2

      - name: Show build output
        run: find cosmo-build -maxdepth 3 -type f \( -name '*.js' -o -name '*.wasm' -o -name '*.data' -o -name '*.html' -o -name 'cosmo*' \) -print


      - name: Prepare browser test files
        shell: bash
        run: |
          rm -rf cosmo-web
          mkdir -p cosmo-web
          cp cosmo-build/cosmo1.js cosmo-web/cosmo1.js
          cp cosmo-build/cosmo1.wasm cosmo-web/cosmo1.wasm
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("games/cosmos-cosmic-adventure.jsdos") as z:
              for name in ("COSMO/COSMO1.STN", "COSMO/COSMO1.VOL"):
                  with z.open(name) as src, open("cosmo-web/" + name.rsplit("/", 1)[-1], "wb") as dst:
                      dst.write(src.read())
          PY
          cat > cosmo-web/index.html <<'HTML'
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmo's Cosmic Adventure — Web Test</title>
<style>
html,body{margin:0;background:#111;color:#eee;font-family:Arial,sans-serif;text-align:center}
.wrap{max-width:1000px;margin:auto;padding:24px 16px 40px}
h1{margin:0 0 8px;color:#7fd8ff}
p{color:#bbb}
#status{min-height:24px;margin:12px 0}
canvas{width:min(960px,100%);height:auto;image-rendering:pixelated;background:#000;border:2px solid #444}
.button{display:inline-block;margin-top:18px;padding:10px 16px;background:#1677b8;color:#fff;text-decoration:none;border-radius:7px;font-weight:bold}
</style>
</head>
<body>
<div class="wrap">
<h1>Cosmo's Cosmic Adventure</h1>
<p>This browser version uses the native Cosmo engine compiled to WebAssembly, rather than DOSBox.</p>
<div id="status">Loading Cosmo…</div>
<canvas id="canvas" width="960" height="600"></canvas>
<br><a class="button" href="../index.html">← Back to DOS Arcade</a>
</div>
<script>
var statusEl=document.getElementById('status');
var Module={
  canvas:document.getElementById('canvas'),
  print:function(t){statusEl.textContent=t;},
  printErr:function(t){statusEl.textContent=t;},
  preRun:[function(){
    Module.addRunDependency('cosmo-data');
    Promise.all(['COSMO1.STN','COSMO1.VOL'].map(function(name){
      return fetch(name).then(function(r){
        if(!r.ok) throw new Error('Could not load '+name);
        return r.arrayBuffer();
      }).then(function(buf){
        FS_createDataFile('/',name,new Uint8Array(buf),true,true,true);
      });
    })).then(function(){
      Module.removeRunDependency('cosmo-data');
      statusEl.textContent='Starting Cosmo…';
    }).catch(function(err){
      statusEl.textContent='Could not load Cosmo game data: '+err;
    });
  }]
};
</script>
<script src="cosmo1.js"></script>
</body>
</html>
HTML

      - name: Upload browser test files
        uses: actions/upload-artifact@v4
        with:
          name: cosmo-web-site
          path: cosmo-web

      - name: Upload experimental web build
        uses: actions/upload-artifact@v4
        with:
          name: cosmo-web-experimental
          path: |
            cosmo-build/**/*.js
            cosmo-build/**/*.wasm
            cosmo-build/**/*.data
            cosmo-build/**/*.html
          if-no-files-found: error
