name: Build Cosmo Web
# Browser edition v2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-cosmo-web.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out arcade
        uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Clone native Cosmo source
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/digows/cosmo.git cosmo-src

      - name: Prepare Cosmo game data for WebAssembly
        shell: bash
        run: |
          mkdir -p web-data
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("games/cosmos-cosmic-adventure.jsdos") as z:
              for name in ("COSMO/COSMO1.STN", "COSMO/COSMO1.VOL"):
                  with z.open(name) as src, open("web-data/" + name.rsplit("/", 1)[-1], "wb") as dst:
                      dst.write(src.read())
          PY

      - name: Configure Emscripten build
        shell: bash
        run: |
          source "$EMSDK/emsdk_env.sh"
          emcmake cmake -S cosmo-src -B cosmo-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCOSMO_BUILD_TESTS=OFF \
            -DCOSMO_BUILD_GAME=ON \
            -DCOSMO_BUNDLE=OFF \
            -DCOSMO_FETCH_SDL=ON \
            -DSDL_PTHREADS=ON \
            -DCMAKE_C_EXTENSIONS=ON \
            -DCMAKE_CXX_EXTENSIONS=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-pthread -sUSE_PTHREADS=1 -sPTHREAD_POOL_SIZE=2 -sPROXY_TO_PTHREAD=1 -sALLOW_MEMORY_GROWTH=1 -sFORCE_FILESYSTEM=1 --preload-file $GITHUB_WORKSPACE/web-data/COSMO1.STN@/COSMO1.STN --preload-file $GITHUB_WORKSPACE/web-data/COSMO1.VOL@/COSMO1.VOL" \
            -DCMAKE_SHARED_LINKER_FLAGS='-sALLOW_MEMORY_GROWTH=1'

      - name: Fix Emscripten C extension mode for SDL3
        shell: bash
        run: |
          find cosmo-build -type f \( -name 'build.make' -o -name 'flags.make' -o -name 'link.txt' \) -print0 | \
            xargs -0 -r sed -i -E 's/-std=c([0-9]+)/-std=gnu\1/g'

      - name: Build
        shell: bash
        run: |
          source "$EMSDK/emsdk_env.sh"
          cmake --build cosmo-build --config Release -j2

      - name: Show build output
        run: find cosmo-build -maxdepth 3 -type f \( -name '*.js' -o -name '*.wasm' -o -name '*.data' -o -name '*.html' -o -name 'cosmo*' \) -print


      - name: Prepare browser test files
        shell: bash
        run: |
          rm -rf cosmo-web-build
          mkdir -p cosmo-web-build
          cp cosmo-build/cosmo1.js cosmo-web-build/cosmo1.js
          cp cosmo-build/cosmo1.wasm cosmo-web-build/cosmo1.wasm
          cp cosmo-build/cosmo1.data cosmo-web-build/cosmo1.data
          cp cosmo-web-v2/index.html cosmo-web-build/index.html
          cp coi-serviceworker.js cosmo-web-build/coi-serviceworker.js

      - name: Publish browser files to GitHub Pages
        shell: bash
        run: |
          mkdir -p cosmo-web-v2
          cp cosmo-web-build/cosmo1.js cosmo-web-v2/cosmo1.js
          cp cosmo-web-build/cosmo1.wasm cosmo-web-v2/cosmo1.wasm
          cp cosmo-web-build/cosmo1.data cosmo-web-v2/cosmo1.data
          cp cosmo-web-build/coi-serviceworker.js cosmo-web-v2/coi-serviceworker.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cosmo-web-v2/cosmo1.js cosmo-web-v2/cosmo1.wasm cosmo-web-v2/cosmo1.data cosmo-web-v2/coi-serviceworker.js
          git diff --cached --quiet || git commit -m "Publish Cosmo Web build to v2"
          git push

      - name: Upload browser test files
        uses: actions/upload-artifact@v4
        with:
          name: cosmo-web-site
          path: cosmo-web-build

      - name: Upload experimental web build
        uses: actions/upload-artifact@v4
        with:
          name: cosmo-web-experimental
          path: |
            cosmo-build/**/*.js
            cosmo-build/**/*.wasm
            cosmo-build/**/*.data
            cosmo-build/**/*.html
          if-no-files-found: error
