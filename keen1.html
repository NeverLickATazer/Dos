<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr. Le Claire's DOS Arcade - Commander Keen: Marooned on Mars</title>
<link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
<script src="https://v8.js-dos.com/latest/js-dos.js"></script>
<style>
html,body{margin:0;background:#111;color:#eee;font-family:Arial,sans-serif;text-align:center;overflow:hidden}
.wrap{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;box-sizing:border-box;gap:6px}
.player{width:min(960px,96vw);height:min(88vh,720px);background:#000;border:2px solid #444}
.button{display:inline-block;padding:9px 14px;background:#1677b8;color:#fff;text-decoration:none;border-radius:7px;font-weight:bold}
.help{font-size:12px;color:#ccc}
</style>
</head>
<body>
<div class="wrap">
<div id="player" class="player"></div>
<div class="help">Controls: Arrow Keys = Move &nbsp;|&nbsp; Ctrl = Jump &nbsp;|&nbsp; Alt = Pogo &nbsp;|&nbsp; Space = Fire &nbsp;|&nbsp; Enter = Enter/Select &nbsp;|&nbsp; M = Menu</div>
<a class="button" href="index.html">← Back to DOS Arcade</a>
</div>
<script>
const player=document.getElementById("player");
try{
 if(typeof window.Dos!=="function") throw new Error("js-dos did not load.");
 Dos(player,{url:"https://raw.githubusercontent.com/bladeclickers/bladeclickers.github.io/main/commander-keen-1-episode-1/keen1.jsdos",autoStart:true,workerThread:false,offscreenCanvas:false,renderBackend:"canvas"});

 // Space fires by sending Keen's original Ctrl+Alt fire combination.
 // Enter is left completely alone so it reaches the game as a real Enter key.
 // M is mapped to Keen's original Space/status-menu key.
 let spaceFire=false;
 let menuDown=false;

 function sendKey(type,key,code,keyCode,mods){
   document.dispatchEvent(new KeyboardEvent(type,{
     key:key,code:code,keyCode:keyCode,which:keyCode,bubbles:true,
     ctrlKey:!!(mods&&mods.ctrlKey),altKey:!!(mods&&mods.altKey)
   }));
 }

 document.addEventListener("keydown",function(e){
   if(e.code==="Space"){
     e.preventDefault();
     e.stopPropagation();
     if(!spaceFire){
       spaceFire=true;
       sendKey("keydown","Control","ControlLeft",17,{ctrlKey:true});
       sendKey("keydown","Alt","AltLeft",18,{ctrlKey:true,altKey:true});
     }
   } else if(e.code==="KeyM"){
     e.preventDefault();
     e.stopPropagation();
     if(!menuDown){
       menuDown=true;
       sendKey("keydown"," ","Space",32,{});
     }
   }
 },true);

 document.addEventListener("keyup",function(e){
   if(e.code==="Space"){
     e.preventDefault();
     e.stopPropagation();
     if(spaceFire){
       spaceFire=false;
       sendKey("keyup","Alt","AltLeft",18,{});
       sendKey("keyup","Control","ControlLeft",17,{});
     }
   } else if(e.code==="KeyM"){
     e.preventDefault();
     e.stopPropagation();
     if(menuDown){
       menuDown=false;
       sendKey("keyup"," ","Space",32,{});
     }
   }
 },true);
}catch(e){
 player.innerHTML='<div style="padding:30px;color:#fff;font-family:monospace">ERROR: '+(e.message||e)+'</div>';
 console.error(e);
}
</script>
</body>
</html>
