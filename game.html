<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr. Le Claire's DOS Arcade</title>
<link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
<script src="https://v8.js-dos.com/latest/js-dos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
html,body{margin:0;background:#111;color:#eee;font-family:Arial,sans-serif;text-align:center;overflow:hidden}
.wrap{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;box-sizing:border-box;gap:6px}
.player{width:min(960px,96vw);height:min(88vh,720px);background:#000;border:2px solid #444}
.button{display:inline-block;padding:9px 14px;background:#1677b8;color:#fff;text-decoration:none;border-radius:7px;font-weight:bold}
</style>
</head>
<body>
<div class="wrap">
<div id="player" class="player"></div>
<a class="button" href="index.html">← Back to DOS Arcade</a>
</div>
<script>
const params=new URLSearchParams(location.search);
const game=params.get('game');
const games={
 cosmo:{title:"Cosmo's Cosmic Adventure",url:"games/cosmos-cosmic-adventure.jsdos"},
 noah:{title:"Super 3-D Noah's Ark",url:"games/noahs-ark.jsdos"},
 chex:{title:"Chex Quest",url:"games/chex-quest.jsdos"}
};
const selected=games[game];
const player=document.getElementById('player');

async function startGame(){
 if(!selected){
  player.innerHTML='<div style="padding:30px;color:#fff">Game not found.</div>';
  return;
 }
 try{
  if(typeof window.Dos!=='function')throw new Error('js-dos did not load.');
  if(game==='cosmo') return;

  const response=await fetch(selected.url);
  if(!response.ok)throw new Error('Could not load the game file.');
  const zip=await JSZip.loadAsync(await response.arrayBuffer());
  const initFs=[];

  for(const name of Object.keys(zip.files)){
   const entry=zip.files[name];
   if(entry.dir || name.startsWith('.jsdos/')) continue;
   initFs.push({path:name,contents:await entry.async('uint8array')});
  }

  let config;
  if(game==='noah'){
   config=`[sdl]
autolock=false

[dosbox]
machine=vgaonly
memsize=16

[dos]
xms=true
ems=true
umb=true
keyboardlayout=auto

[cpu]
core=normal
cycles=auto
cycleup=500
cycledown=500

[render]
aspect=false
scaler=normal2x
frameskip=0

[autoexec]
SET BLASTER=A220 I7 D1 H5 T6
mount c .
c:
NOAH3DOS.EXE
`;
  } else if(game==='chex'){
   config=`[sdl]
autolock=false

[dosbox]
machine=svga_s3
memsize=16

[dos]
xms=true
ems=true
umb=true
keyboardlayout=auto

[cpu]
core=normal
cycles=auto
cycleup=500
cycledown=500

[render]
aspect=true
scaler=normal2x
frameskip=0

[autoexec]
mount c .
c:
CHEX.EXE
`;
  } else {
   throw new Error('Unsupported game.');
  }

  const instance=Dos(player,{dosboxConf:config,initFs:initFs,backend:'dosbox',backendLocked:true,workerThread:false,offscreenCanvas:false,renderBackend:'canvas',autoStart:true});
  window.currentDosInstance=instance;
 }catch(error){
  player.innerHTML='<div style="padding:30px;color:#fff;font-family:monospace">ERROR: '+(error.message||error)+'</div>';
  console.error(error);
 }
}
startGame();
</script>
</body>
</html>
