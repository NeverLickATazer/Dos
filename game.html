<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr. Le Claire's DOS Arcade</title>
<link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
<script src="https://v8.js-dos.com/latest/js-dos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
html,body{margin:0;min-height:100%;background:#000;color:#39ff72;font-family:"Courier New",monospace}
body{padding:20px;box-sizing:border-box}.wrap{max-width:1000px;margin:auto}
h1{border:3px solid #39ff72;padding:15px;text-align:center;background:#071008}
.status{padding:10px;border:1px solid #23833c;margin:12px 0;color:#ffe66d}
.player{width:100%;height:min(70vh,650px);min-height:400px;border:2px solid #23833c;background:#000}a{color:#39ff72}
</style>
</head>
<body>
<div class="wrap">
<h1 id="title">💾 DOS ARCADE 💾</h1>
<div id="status" class="status">Starting game...</div>
<div id="player" class="player"></div>
<p><a href="index.html">← Back to Mr. Le Claire's DOS Arcade</a></p>
</div>
<script>
const params=new URLSearchParams(location.search);
const game=params.get('game');
const games={
 cosmo:{title:"👽 COSMO'S COSMIC ADVENTURE",url:"games/cosmos-cosmic-adventure.jsdos"},
 noah:{title:"🐑 SUPER 3-D NOAH'S ARK",url:"games/noahs-ark.jsdos"},
 chex:{title:"🥣 CHEX QUEST",url:"games/chex-quest.jsdos"}
};
const selected=games[game];
const title=document.getElementById('title');
const status=document.getElementById('status');
const player=document.getElementById('player');

async function startGame(){
 if(!selected){title.textContent='GAME NOT FOUND';status.textContent='No valid game was selected.';return;}
 title.textContent=selected.title;
 try{
  if(typeof window.Dos!=='function')throw new Error('js-dos did not load.');
  if(game==='noah'){
   status.textContent='Starting Noah with DOSBox compatibility settings...';
   const noahConfig=`[sdl]
autolock=false

[dosbox]
machine=svga_s3
memsize=16

[dos]
xms=true
ems=true
umb=true
keyboardlayout=auto

[cpu]
core=normal
cycles=fixed 12000
cycleup=500
cycledown=500

[render]
aspect=true
scaler=none
frameskip=0

[autoexec]
SET BLASTER=A220 I7 D1 H5 T6
NOAH3DOS.EXE
`;
   Dos(player,{url:selected.url,dosboxConf:noahConfig,autoStart:true,
     onEvent:(e)=>status.textContent='js-dos: '+e,
     onerror:(e)=>status.textContent='NOAH ERROR: '+e});
   return;
  }
  if(game!=='cosmo'){
   Dos(player,{url:selected.url,autoStart:true,onEvent:(e)=>status.textContent='js-dos: '+e,
     onerror:(e)=>status.textContent='GAME ERROR: '+e});
   return;
  }
  status.textContent='Preparing Cosmo...';
  if(typeof JSZip!=='function')throw new Error('ZIP library did not load.');
  const response=await fetch(selected.url);
  if(!response.ok)throw new Error('Could not load the Cosmo game file.');
  const zip=await JSZip.loadAsync(await response.arrayBuffer());
  const initFs=[];
  for(const name of Object.keys(zip.files)){
   const entry=zip.files[name];
   if(entry.dir||name.startsWith('.jsdos/'))continue;
   initFs.push({path:name,contents:await entry.async('uint8array')});
  }
  const config=`[sdl]\nautolock=false\n\n[dosbox]\nmachine=svga_s3\n\n[dos]\nxms=false\nems=false\numb=true\nkeyboardlayout=auto\n\n[cpu]\ncore=normal\ncycles=fixed 3000\ncycleup=500\ncycledown=500\n\n[render]\naspect=true\nscaler=none\nframeskip=0\n\n[autoexec]\nmount c .\nc:\ncd COSMO\nloadfix -25\nCOSMO1.EXE\n`;
  status.textContent='Starting Cosmo with compatibility settings...';
  Dos(player,{dosboxConf:config,initFs:initFs,autoStart:true,onEvent:(e)=>status.textContent='js-dos: '+e});
 }catch(error){status.textContent='ERROR: '+(error.message||error);console.error(error);}
}
startGame();
</script>
</body>
</html>
