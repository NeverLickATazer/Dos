<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr. Le Claire's DOS Arcade</title>
<link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
<script src="https://v8.js-dos.com/latest/js-dos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
html,body{margin:0;background:#111;color:#eee;font-family:Arial,sans-serif;text-align:center;overflow:hidden}
.wrap{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;box-sizing:border-box;gap:6px}
.player{width:min(960px,96vw);height:min(88vh,720px);background:#000;border:2px solid #444}
.button{display:inline-block;padding:9px 14px;background:#1677b8;color:#fff;text-decoration:none;border-radius:7px;font-weight:bold}
</style>
</head>
<body>
<div class="wrap">
<div id="player" class="player"></div>
<a class="button" href="index.html">← Back to DOS Arcade</a>
</div>
<script>
const params=new URLSearchParams(location.search);
const game=params.get('game');
const games={
 cosmo:{title:"Cosmo's Cosmic Adventure",url:"games/cosmos-cosmic-adventure.jsdos"},
 noah:{title:"Super 3-D Noah's Ark",url:"games/noahs-ark.jsdos"},
 chex:{title:"Chex Quest",url:"games/chex-quest.jsdos"}
};
const selected=games[game];
const player=document.getElementById('player');

async function startGame(){
 if(!selected){
  player.innerHTML='<div style="padding:30px;color:#fff">Game not found.</div>';
  return;
 }
 try{
  if(typeof window.Dos!=='function')throw new Error('js-dos did not load.');
  if(game==='cosmo') return;

  const response=await fetch(selected.url);
  if(!response.ok)throw new Error('Could not load the game file.');
  const zip=await JSZip.loadAsync(await response.arrayBuffer());

  const confFile=zip.file('.jsdos/dosbox.conf');
  if(!confFile)throw new Error('The game bundle is missing its DOSBox configuration.');

  let conf=await confFile.async('string');

  if(game==='noah'){
   conf=conf
    .replace(/machine=[^\n]*/i,'machine=svga_s3')
    .replace(/memsize=[^\n]*/i,'memsize=16')
    .replace(/core=[^\n]*/i,'core=auto')
    .replace(/cycles=[^\n]*/i,'cycles=auto')
    .replace(/scaler=[^\n]*/i,'scaler=normal2x');
  }

  zip.file('.jsdos/dosbox.conf',conf);

  const bundleBlob=await zip.generateAsync({
   type:'blob',
   compression:'DEFLATE',
   compressionOptions:{level:6}
  });
  const bundleUrl=URL.createObjectURL(bundleBlob);

  const options={url:bundleUrl,autoStart:true};
  if(game==='noah'){
   options.backend='dosboxX';
   options.backendLocked=true;
  }
  if(game==='chex'){
   options.backend='dosbox';
   options.backendLocked=true;
  }

  const instance=Dos(player,options);
  window.currentDosInstance=instance;
 }catch(error){
  player.innerHTML='<div style="padding:30px;color:#fff;font-family:monospace">ERROR: '+(error.message||error)+'</div>';
  console.error(error);
 }
}
startGame();
</script>
</body>
</html>
